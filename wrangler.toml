# 感応山 妙傳寺のホームページ(Cloudflare から配る。2026-09-30)
#   npm がなくてよい。node scripts/build-dist.mjs で dist/ を作ってから npx wrangler deploy
#   仮のアドレス:https://myodenji-hp.myodenji7676.workers.dev
#   myodenji7676.online をここにつなぐのは、住職が確かめてから(ネームサーバーを Cloudflare に移したあと、Custom Domain を足す)
name = "myodenji-hp"
main = "worker.js"
compatibility_date = "2026-05-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# 法輪(文面・写真の直しと、フォームの受け口)
[[services]]
binding = "KANRI"
service = "myodenji-kanri"

[vars]
KANRI_HOST = "myodenji-hp.myodenji7676.workers.dev"
